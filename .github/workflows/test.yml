name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Once a week on main, so a change in a dependency or a runner image shows
  # up between commits.
  schedule:
    - cron: "37 6 * * 0"
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Build and test (rules)
        run: bazel test --test_output=errors //...
      - name: Build and test (integration examples)
        run: |
          cd integration
          bazel test --test_output=errors //...
